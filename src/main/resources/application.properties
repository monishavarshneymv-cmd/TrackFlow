spring.application.name=trackflow
server.port=8080

# PostgreSQL Configuration (Local Development Defaults with Environment Variable Overrides)
# In production, provide DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD via environment variables.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:trackflow_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
